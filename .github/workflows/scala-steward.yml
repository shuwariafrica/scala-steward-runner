name: Execute Scala Steward

# The managed repository list is computed fresh every run (the discover
# job's artifact) - repository-exclusions.md and repository-inclusions.md
# are the only persisted state. Scala Steward runs from the
# shuwariafrica/scala-steward fork, which creates commits through the GitHub
# API as the Shuwari Project Steward App so GitHub signs them; no user
# account or signing key is involved.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scala-steward
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SCALA_STEWARD_APP_ID }}
          private-key: ${{ secrets.SCALA_STEWARD_APP_KEY }}
          owner: shuwariafrica
          permission-contents: read
          permission-metadata: read

      - name: Compute managed repository list
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          # No -e: one repo's contents-API call failing must not abort the
          # scan of the rest.

          candidates=$(gh api /installation/repositories --paginate \
            --jq '.repositories[] | select(.archived == false and .fork == false) | .full_name')

          sbt_repos=""
          for repo in $candidates; do
            gh api "repos/$repo/contents/build.sbt" --silent 2>/dev/null || continue
            sbt_repos="$sbt_repos"$'\n'"$repo"
          done

          list_repos() { sed -n 's/^- //p' "$1" 2>/dev/null; }
          exclusions=$(list_repos .github/repository-exclusions.md)
          raw_inclusions=$(list_repos .github/repository-inclusions.md)

          # Inclusions bypass the .archived filter above; GitHub rejects
          # writes to an archived repo regardless.
          inclusions=""
          for repo in $raw_inclusions; do
            [ "$(gh api "repos/$repo" --jq '.archived' 2>/dev/null)" = "true" ] && continue
            inclusions="$inclusions"$'\n'"$repo"
          done

          final=$(comm -23 <(sort -u <<< "$sbt_repos") <(sort -u <<< "$exclusions"))
          final=$(sort -u <<< "$final"$'\n'"$inclusions" | grep -v '^$')

          sed 's/^/- /' <<< "$final" > repos.md
          {
            echo "## Managed repositories ($(wc -l < repos.md | tr -d ' ') total)"
            echo
            cat repos.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repos
          path: repos.md
          retention-days: 1

  scala-steward:
    needs: discover
    runs-on: ubuntu-latest
    env:
      # A relative path prevents Docker host-to-container absolute path mismatches
      WORKSPACE_DIR: 'steward-workspace'
      # Bump both together. The version's minor must stay at 33 or above:
      # scala-steward-action derives the _3 artifact suffix from it.
      STEWARD_REF: 991d10a1267605c5edc8781a948d4aa605b0ebc6
      STEWARD_VERSION: 0.99.0-991d10a1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repos

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # kufuli asserts JDK >= 25 at load time (build.sbt)
          java-version: 25.0.4+101.0.LTS
          architecture: x64

      - name: Scala Steward build cache
        id: steward-build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ivy2/local/org.scala-steward
          key: ${{ runner.os }}-scala-steward-build-${{ env.STEWARD_REF }}

      - name: Check out Scala Steward
        if: steps.steward-build.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shuwariafrica/scala-steward
          ref: ${{ env.STEWARD_REF }}
          path: scala-steward-src
          persist-credentials: false

      - name: Set up sbt
        if: steps.steward-build.outputs.cache-hit != 'true'
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Build Scala Steward
        if: steps.steward-build.outputs.cache-hit != 'true'
        working-directory: scala-steward-src
        run: |
          set -euo pipefail
          scala3=$(sed -n 's/^val Scala3 = "\(.*\)"$/\1/p' build.sbt)
          [ -n "${scala3}" ] || { echo "::error::no Scala3 version in build.sbt"; exit 1; }
          sbt "set ThisBuild / version := \"${STEWARD_VERSION}\"" "++${scala3}" core/publishLocal

      - name: Scala Steward Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/${{ env.WORKSPACE_DIR }}
          # Dynamic key ensures the updated workspace is saved after every run
          key: ${{ runner.os }}-scala-steward-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-scala-steward-

      - name: Execute Scala Steward
        uses: scala-steward-org/scala-steward-action@6162b21b93d4be314a61ce0462fd026630132fee # v2.96.0
        env:
          # The fork build above is published to ivy2Local only.
          COURSIER_REPOSITORIES: ivy2Local|central
        with:
          scala-steward-version: ${{ env.STEWARD_VERSION }}
          github-app-id: ${{ secrets.SCALA_STEWARD_APP_ID }}
          github-app-installation-id: ${{ secrets.SCALA_STEWARD_APP_INSTALLATION_ID }}
          github-app-key: ${{ secrets.SCALA_STEWARD_APP_KEY }}
          # Keeps repos.md, and with it the exclusions, the repository list.
          github-app-auth-only: true
          repos-file: 'repos.md'
          repo-config: '.github/.scala-steward.conf'
          other-args: '--github-api-commits --workspace ${{ env.WORKSPACE_DIR }}'
